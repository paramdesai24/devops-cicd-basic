name: Cloud-Native CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Concurrency control: cancel previous in-flight runs for same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ==========================================
  # STAGE 1: CONTINUOUS INTEGRATION (CI)
  # ==========================================
  continuous-integration:
    name: 🧪 CI - Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js runtime (No Docker)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install application dependencies
        run: npm install

      - name: 🔍 Verify application syntax & lint
        run: node -c src/server.js src/app.js

      - name: 🧪 Execute automated unit & integration tests
        run: npm test

      - name: 📦 Archive production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud-native-build-artifact
          path: |
            src/
            public/
            package.json
            package-lock.json
          retention-days: 7

  # ==========================================
  # STAGE 2: CONTINUOUS DEPLOYMENT (CD)
  # ==========================================
  continuous-deployment:
    name: 🚀 CD - Automated Deployment
    needs: [continuous-integration]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install production dependencies
        run: npm install --omit=dev

      - name: 🧪 Run pre-deployment smoke checks
        run: |
          echo "Running pre-flight smoke checks..."
          node -e "const app = require('./src/app'); console.log('App loaded successfully');"

      - name: 🌐 Prepare GitHub Pages deployment artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: 🚀 Deploy to GitHub Pages (Live Web URL)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: 📋 Deployment verification & summary
        run: |
          echo "=================================================="
          echo "✅ Continuous Deployment Completed Successfully!"
          echo "Target Environment: Production"
          echo "Triggered by Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "=================================================="
