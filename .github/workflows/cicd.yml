name: Cloud-Native CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Concurrency control: cancel previous in-flight runs for same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  # ==========================================
  # STAGE 1: CONTINUOUS INTEGRATION (CI)
  # ==========================================
  continuous-integration:
    name: 🧪 CI - Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install application dependencies
        run: npm install

      - name: 🔍 Verify application syntax & lint
        run: node -c src/server.js src/app.js

      - name: 🧪 Execute automated unit & integration tests
        run: npm test

      - name: 📦 Archive production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud-native-build-artifact
          path: |
            src/
            public/
            package.json
            package-lock.json
          retention-days: 7

  # ==========================================
  # STAGE 2: DOCKER CONTAINER BUILD & TEST
  # ==========================================
  docker-build-test:
    name: 🐳 Docker - Container Build & Health Probe
    needs: [continuous-integration]
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Docker Image
        run: |
          docker build -t novashop-app:local .

      - name: 🚀 Run Containerized Application
        run: |
          docker run -d --name novashop-container -p 3000:3000 novashop-app:local
          sleep 5

      - name: 🩺 Test Container Health Probe
        run: |
          echo "Pinging container health check endpoint..."
          curl --fail --retry 3 --retry-delay 2 http://localhost:3000/health || exit 1
          echo "Container health check passed successfully!"

      - name: 🛑 Cleanup Test Container
        run: |
          docker stop novashop-container && docker rm novashop-container

      - name: 🔐 Log in to GitHub Container Registry (Zero sign-in required)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Push Docker Image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}
          # Convert to lowercase
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          docker tag novashop-app:local $IMAGE_ID:latest
          docker tag novashop-app:local $IMAGE_ID:${{ github.sha }}
          docker push $IMAGE_ID:latest
          docker push $IMAGE_ID:${{ github.sha }}
          echo "Docker image published to $IMAGE_ID:latest"

  # ==========================================
  # STAGE 3: CONTINUOUS DEPLOYMENT (CD)
  # ==========================================
  continuous-deployment:
    name: 🚀 CD - Automated Deployment
    needs: [docker-build-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install production dependencies
        run: npm install --omit=dev

      - name: 🧪 Run pre-deployment smoke checks
        run: |
          echo "Running pre-flight smoke checks..."
          node -e "const app = require('./src/app'); console.log('App loaded successfully');"

      - name: 🌐 Prepare GitHub Pages deployment artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: 🚀 Deploy to GitHub Pages (Live Web URL)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: 📋 Deployment verification & summary
        run: |
          echo "=================================================="
          echo "✅ Continuous Deployment Completed Successfully!"
          echo "Target Environment: Production"
          echo "Docker Image: ghcr.io/${{ github.repository }}:latest"
          echo "Triggered by Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "=================================================="
